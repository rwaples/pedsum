# pedsum runtime / RAM benchmark pedigrees, simulated by simACE.
#
# Copy this file to the simACE umbrella's config/bench_pedsum.yaml (scenario files
# are auto-discovered there) and run `pixi run simace run <scenario> --until simulate`;
# bench_pedsum.sh then reads the pedigree from
# <umbrella>/results/bench_pedsum/<scenario>/rep1/pedigree.parquet, exports it to TSV
# and feeds it to `python -m pedsum summarize`.
#
# Rows = N × G_ped (one row per individual per recorded generation).

pedsum_2M:
  seed: 70001
  N: 250000
  G_ped: 8
  G_sim: 10
  replicates: 1

pedsum_20M:
  seed: 70002
  N: 2500000
  G_ped: 8
  G_sim: 10
  replicates: 1
