  - {dataset: arrui, stat: "Ne_iΔF, reference = target (purgeR uses t-1)", published: 3.83865, tol: 1.0e-4, via: engine:ne_idf_t1_reference, gap: D1, source: purgeR vignette; Heredity 2021 abstract (4)}
  - {dataset: arrui, stat: founder equivalents fe (reference = target), published: 1.769424, via: gap, gap: B1, source: purgeR tutorial vignette, pop_Nancestors table}
