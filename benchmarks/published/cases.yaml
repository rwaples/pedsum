  - {dataset: dorcas, stat: founder equivalents fe (reference = target), published: 13.38647, via: gap, gap: B1, source: purgeR test_population_parameters.R:29}
  - {dataset: dorcas, stat: effective number of ancestors fa (reference = target), published: 12.9906, via: gap, gap: B2, source: purgeR test_population_parameters.R:30}

