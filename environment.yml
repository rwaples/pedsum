name: pedsum
channels:
  - conda-forge
dependencies:
  - python>=3.13
  - numpy
  - scipy
  - pandas
  - pyyaml
  # pedsum itself never imports numba; it is pedigree-graph's compiled
  # dependency, listed here so conda-forge supplies it rather than pip pulling a
  # wheel in behind the git install below. Deliberately absent from
  # pyproject.toml, which declares only what pedsum imports directly.
  - numba
  # - pigz  # optional: ~3× faster .tsv.gz writes; pedsum falls back to gzip if missing
  - pytest
  - hypothesis
  - ruff
  - pip
  - pip:
      - pedigree-graph @ git+https://github.com/rwaples/pedigree-graph.git@v0.5.3
