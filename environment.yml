name: pedsum
channels:
  - conda-forge
dependencies:
  - python>=3.13
  - numpy
  - scipy
  - pandas>=3,<4
  - pyyaml
  # pedsum imports numba *optionally*, for the sex-concordance permutation
  # sampler only (`--sex-concordance-permutations`), and falls back to a NumPy
  # sampler when it is unimportable. It is also pedigree-graph's compiled
  # dependency, and is listed here so conda-forge supplies it rather than pip
  # pulling a wheel in behind the install below. Deliberately absent from
  # pyproject.toml: a soft import must not constrain NumPy resolution for every
  # pedsum user.
  - numba
  # - pigz  # optional: ~3× faster .tsv.gz writes; pedsum falls back to gzip if missing
  - pytest
  - hypothesis
  - ruff
  - pip
  - pip:
      # Matches the range pyproject.toml declares; pedigree-graph is on PyPI.
      - pedigree-graph>=0.6,<0.7
