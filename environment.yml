name: pedsum
channels:
  - conda-forge
dependencies:
  - python>=3.14
  - numpy
  - scipy
  - polars>=1.43.2,<2
  - pyyaml
  - tqdm
  # The sex-concordance sampler is numba-compiled, so numba is a hard
  # dependency (pyproject.toml); listed here so conda-forge supplies it rather
  # than pip pulling a wheel in behind the install below.
  - numba>=0.68,<1
  # - pigz  # optional: ~3× faster .tsv.gz writes; pedsum falls back to gzip if missing
  - pytest
  - hypothesis
  - ruff
  - pip
  - pip:
      # Match the ranges pyproject.toml declares; both are on PyPI.
      - pedigree-graph>=0.12.1,<0.13
      - pg-phenotype>=0.1.1,<0.2
