# pedsum development environment (simACE family ADR 0018): a self-contained
# locked env installing this repo editable with its test + typecheck extras.
# Everything pedsum needs is already described by pyproject.toml, ruff.toml and
# ty.toml, so this manifest restates no pins of its own.
#
# This is the maintainer environment. environment.yml remains the documented
# install path for outside users; it is a conda recipe, and unlike this manifest
# it is not locked or exercised by CI.
#
# pedigree-graph resolves from PyPI (released wheel), matching what an outside
# user gets. For ad-hoc editable work against the sibling checkout, add locally
# (do NOT commit):
#   pedigree-graph = { path = "../pedigree-graph", editable = true }
[workspace]
name = "pedsum"
channels = ["conda-forge"]
platforms = ["linux-64"]
requires-pixi = ">=0.76,<0.77"

[dependencies]
python = "3.14.*"
pip = "*"

[pypi-dependencies]
pedsum = { path = ".", editable = true, extras = ["test", "typecheck"] }

# `pixi run test` is the parallel suite. Bare `pixi run pytest` stays serial
# and unpinned for verbose output, debugging, and focused runs. The worker
# count and pins were chosen with benchmarks/bench_pytest_workers.sh on the
# 12-core development host, three sweeps of the 646-test suite on 2026-10-12
# (pedigree-graph 0.12.3). Median wall times were 73.39s serial, 31.81s at
# n6t1, 28.53s at n8t1, and 30.98s at n6 unpinned, with overlapping ranges
# (n6t1 30.80-33.45s, n8t1 26.67-31.46s). Aggregate process-tree peak memory
# was 1.89 GiB at n6t1 and 2.44 GiB at n8t1, within the host's 30 GiB budget.
[tasks.test]
description = "Full pytest suite on 8 xdist workers, one numba/BLAS/polars thread each"
cmd = "pytest -n 8 --dist worksteal"
env = { NUMBA_NUM_THREADS = "1", OMP_NUM_THREADS = "1", OPENBLAS_NUM_THREADS = "1", MKL_NUM_THREADS = "1", POLARS_MAX_THREADS = "1" }
